<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048" role="img" aria-label="Ochré gold leaf study on night field">
  <defs>
    <radialGradient id="spot" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#3a2e22"/>
      <stop offset="55%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0c0a08"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0e0a8"/>
      <stop offset="35%" stop-color="#c4a574"/>
      <stop offset="70%" stop-color="#8b5a3c"/>
      <stop offset="100%" stop-color="#e8c547"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1c12" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2a1c12" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="2048" height="2048" fill="url(#spot)"/>
  <!-- Fine gold dust texture (procedural dots) -->
  <g opacity="0.35" fill="#c4a574">
    <circle cx="220" cy="180" r="1.2"/><circle cx="480" cy="260" r="0.9"/><circle cx="710" cy="140" r="1.1"/>
    <circle cx="980" cy="210" r="0.8"/><circle cx="1320" cy="170" r="1.3"/><circle cx="1680" cy="240" r="0.9"/>
    <circle cx="310" cy="1780" r="1"/><circle cx="900" cy="1860" r="1.2"/><circle cx="1500" cy="1810" r="0.8"/>
    <circle cx="1900" cy="900" r="1.1"/><circle cx="160" cy="900" r="0.9"/><circle cx="1024" cy="100" r="1"/>
  </g>
  <!-- Stylised oak leaf in gold leaf -->
  <g transform="translate(1024 1024)">
    <path d="M0,-620 C180,-520 340,-280 360,-40 C380,220 260,480 40,620 C-20,580 -40,520 -20,460 C-80,540 -180,580 -280,520 C-420,400 -480,160 -460,-80 C-440,-340 -260,-540 0,-620 Z" fill="url(#leaf)" stroke="#9a7548" stroke-width="3"/>
    <path d="M0,-580 L20,520" fill="none" stroke="url(#vein)" stroke-width="6"/>
    <path d="M8,-400 C120,-320 180,-200 200,-40" fill="none" stroke="#3d2a0a" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M6,-200 C-140,-140 -200,-20 -210,160" fill="none" stroke="#3d2a0a" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M10,40 C130,120 160,260 120,400" fill="none" stroke="#3d2a0a" stroke-opacity="0.28" stroke-width="2.5"/>
    <path d="M4,200 C-110,260 -140,380 -80,500" fill="none" stroke="#3d2a0a" stroke-opacity="0.28" stroke-width="2.5"/>
    <!-- Micro-flake detail for deep zoom -->
    <g fill="#f5e6b8" opacity="0.5">
      <circle cx="-120" cy="-200" r="2"/><circle cx="140" cy="-80" r="1.5"/><circle cx="-60" cy="180" r="1.8"/>
      <circle cx="90" cy="300" r="1.4"/><circle cx="-200" cy="40" r="1.6"/><circle cx="40" cy="-320" r="1.2"/>
    </g>
  </g>
  <text x="1024" y="1920" text-anchor="middle" fill="#a89884" font-family="Georgia, serif" font-size="36" letter-spacing="8">OCH RÉ · GOLD LEAF STUDY</text>
</svg>
